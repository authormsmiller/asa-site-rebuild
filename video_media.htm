  <style>
    .media-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }

    .media-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--field-olive);
      border-radius: 8px;
      text-decoration: none;
      color: var(--charcoal);
      transition: all 0.15s ease-in-out;
    }

    .media-card:hover {
      background: var(--bg-surface);
      border-color: var(--cav-gold);
      border-left-color: var(--cav-gold);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .media-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      fill: var(--field-olive);
      transition: fill 0.15s ease;
    }

    .media-card:hover .media-icon {
      fill: var(--cav-gold-hover);
    }

    .media-info {
      flex-grow: 1;
    }
